<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前后端分离计算器 | Separated Calculator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>前后端分离计算器</h1>
      <div class="status" id="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">正在检测后端服务…</span>
      </div>
    </header>

    <main class="layout">
      <!-- 计算器主体 -->
      <section class="calculator" aria-label="计算器">
        <div class="display">
          <div class="display-label">表达式</div>
          <input
            id="expression"
            class="display-input"
            type="text"
            inputmode="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="例如 (1+2)*3"
          />
          <div class="display-result">
            <span class="display-label">结果</span>
            <span id="result" class="result-value">—</span>
          </div>
          <div id="message" class="message" role="alert" aria-live="polite"></div>
        </div>

        <div class="keys" id="keys">
          <button class="key key-func" data-action="clear">C</button>
          <button class="key key-func" data-value="(">(</button>
          <button class="key key-func" data-value=")">)</button>
          <button class="key key-func" data-action="backspace">⌫</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key key-op" data-value="÷">÷</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key key-op" data-value="×">×</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key key-op" data-value="-">−</button>

          <button class="key" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key key-op" data-value="+">+</button>
          <button class="key key-equals" data-action="equals">=</button>
        </div>
      </section>

      <!-- 历史记录面板 -->
      <aside class="history" aria-label="计算历史">
        <div class="history-header">
          <h2>计算历史</h2>
          <div class="history-actions">
            <button id="refresh-history" class="btn btn-ghost" title="刷新">刷新</button>
            <button id="clear-history" class="btn btn-ghost btn-danger" title="清空全部">清空</button>
          </div>
        </div>
        <p class="history-hint">历史记录保存在后端数据库中，刷新页面不会丢失。</p>
        <ul id="history-list" class="history-list"></ul>
        <div id="history-empty" class="history-empty">暂无历史记录</div>
      </aside>
    </main>

    <footer class="app-footer">
      <span>前端：原生 HTML / CSS / JavaScript</span>
      <span>后端：Flask + SQLite</span>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
